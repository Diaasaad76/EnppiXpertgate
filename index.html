<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENPPI XpertGate — Petroleum Sector Trainers & Experts Pool</title>
    <meta http-equiv="refresh" content="0; url=demo/index.html">
    <link rel="icon" type="image/jpeg" href="demo/assets/Logo.jpeg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at top, #0A192F 0%, #030A16 100%);
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            text-align: center;
        }
        .redirect-card {
            background: rgba(10, 25, 47, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            max-width: 480px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .logo-img {
            max-width: 140px;
            height: auto;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 1.4rem;
            color: #D4AF37;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
        }
        p {
            color: #94A3B8;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .btn-enter {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #D4AF37 0%, #AA820A 100%);
            color: #030A16;
            font-weight: 700;
            text-decoration: none;
            padding: 0.75rem 1.75rem;
            border-radius: 999px;
            font-size: 0.95rem;
            transition: transform 0.2s;
        }
        .btn-enter:hover {
            transform: scale(1.03);
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            border-top-color: #D4AF37;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        window.location.replace("demo/index.html");
    </script>
</head>
<body>
    <div class="redirect-card">
        <img src="demo/assets/Logo.jpeg" alt="ENPPI Logo" class="logo-img">
        <div class="spinner"></div>
        <h1>ENPPI XpertGate</h1>
        <p>Loading interactive portal for demonstration...</p>
        <a href="demo/index.html" class="btn-enter">Enter Demo Now &rarr;</a>
    </div>
</body>
</html>
